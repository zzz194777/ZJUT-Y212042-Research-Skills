const PAPERS = [{"id": 1, "title_full": "DepMamba: Progressive Fusion Mamba for Multimodal Depression Detection", "title_short": "DepMamba: Progressive Fusion Mamba for Multim…", "abs_full": "Depression is a common mental disorder that affects millions of people worldwide. Although promising, current multimodal methods hinge on aligned or aggregated multi-modal fusion, suffering two significant limitations: (i) inefficient long-range temporal modeling, and (ii) sub-optimal multimodal fusion between intermodal fusion and intramodal processing. In this paper, we propose an audio-visual progressive fusion Mamba for multimodal depression detection, termed DepMamba. DepMamba features two core designs: hierarchical contextual modeling and progressive multimodal fusion. On the one hand, hierarchical modeling introduces convolution neural networks and Mamba to extract the local-to-global features within long-range sequences. On the other hand, the progressive fusion first presents a multimodal collaborative State Space Model (SSM) extracting intermodal and intramodal information for each modality, and then utilizes a multimodal enhanced SSM for modality cohesion. Extensive experime", "cn_abstract": "📌 论文标题: DepMamba: Progressive Fusion Mamba for Multimodal Depression Detection\n✍️ 作者: Jiaxin Ye、Junping Zhang、Hongming Shan\n📍 发表: ICASSP (2025)\n🧠 核心架构: Mamba/SSM\n🎭 涉及模态: Text+Audio+Video\n\n🇨🇳 中文摘要:\n本文提出了基于Mamba/SSM的方法，融合Text+Audio+Video模态信息。Depression is a common mental disorder that affects millions of people worldwide", "venue": "ICASSP", "year": 2025, "authors": "Jiaxin Ye, Junping Zhang, Hongming Shan", "archs": ["Mamba/SSM"], "modals": ["Text", "Audio", "Video"], "stars": 4, "color": "#e74c3c", "doi": "10.1109/icassp49660.2025.10889975", "url": "https://doi.org/10.1109/icassp49660.2025.10889975", "doi_valid": true, "url_valid": true, "github": "https://github.com/Jiaxin-Ye/DepMamba", "gh_method": "landing", "compute": "24GB VRAM (RTX 4090)", "source": "openalex", "citationCount": 19, "ccf_tier": "B", "ccf_label": "CCF-B"}, {"id": 2, "title_full": "EMO-Mamba: Multimodal Selective Structured State Space Model for Depression Detection", "title_short": "EMO-Mamba: Multimodal Selective Structured St…", "abs_full": "Depression is a severe mental disorder that significantly affects health and quality of life, making early detection critical for effective treatment and management. In traditional clinical diagnostics, doctors and mental health professionals typically assess emotional states by observing patients’ facial expressions and listening to their speech. Changes in facial expressions can reflect emotional responses, while vocal features such as tone and pace may indicate underlying emotional distress or psychological conditions. Artificial intelligence technologies are adept at efficiently extracting and analyzing these multimedia signals. However, existing methods often overlook critical information when processing long-time series data and struggle to handle multiple modalities simultaneously. To address these issues, we propose the EMO-Mamba, which utilizes selective mechanisms and state space models (SSM) to filter important features and effectively maintain memory over long time-series.", "cn_abstract": "📌 论文标题: EMO-Mamba: Multimodal Selective Structured State Space Model for Depression Detection\n✍️ 作者: Tao Xing、Yutao Dou、Xiaolan Xie 等\n📍 发表: BIBM (2024)\n🧠 核心架构: Mamba/SSM\n🎭 涉及模态: Audio+Video\n\n🇨🇳 中文摘要:\n本文提出了基于Mamba/SSM的方法，融合Audio+Video模态信息。Depression is a severe mental disorder that significantly affects health and quality of life, making early detection critical for effective treatment and management", "venue": "BIBM", "year": 2024, "authors": "Tao Xing, Yutao Dou, Xiaolan Xie, Jiansong Zhou, Xianliang Chen", "archs": ["Mamba/SSM"], "modals": ["Audio", "Video"], "stars": 4, "color": "#e74c3c", "doi": "10.1109/bibm62325.2024.10822789", "url": "https://doi.org/10.1109/bibm62325.2024.10822789", "doi_valid": true, "url_val pdf", "doi_valid": true, "url_valid": true, "github": "", "gh_method": "", "compute": "24-80GB VRAM (A100 40G/80G, 多卡)", "source": "openalex", "citationCount": 18, "ccf_tier": "A", "ccf_label": "CCF-A"}, {"id": 4, "title_full": "MDDMamba: A Model for Multi-Modal Depression Detection with a Memory-Saving Cross-Modal Attention Mechanism Based on Mamba", "title_short": "MDDMamba: A Model for Multi-Modal Depression …", "abs_full": "Depression is a severe mental health disorder that constitutes a significant global health challenge, necessitating efficient and accurate automated diagnostic tools. Traditional approaches to automated depression assessment using multi-modal data often face three significant difficulties: small sample sizes in available datasets, high computational cost, and difficulties in effectively integrating different modalities. In this paper, we first mitigate the problem of dataset quality by utilizing an estimated imputation strategy for missing values based on a known data augmentation method. Additionally, we introduce a multi-modal depression detection model named MDDMamba, designed to address the latter two challenges by integrating features from pre-trained emotion models with the memory-efficient selective state space model named Mamba. The MDDMamba model combines features from pre-trained emotion models for both text and audio, enhancing the extraction of emotional information. The co", "cn_abstract": "📌 论文标题: MDDMamba: A Model for Multi-Modal Depression Detection with a Memory-Saving Cross-Modal Attention Mechanism Based on Mamba\n✍️ 作者: Menghao Liu、Z. M. Wang、Feng Liu\n📍 发表: BIBM (2024)\n🧠 核心架构: Mamba/SSM\n🎭 涉及模态: Text+Audio+Video\n\n🇨🇳 中文摘要:\n本文提出了基于Mamba/SSM的方法，融合Text+Audio+Video模态信息。Depression is a severe mental health disorder that constitutes a significant global health challenge, necessitating efficient and accurate automated diagnostic tools", "venue": "BIBM", "year": 2024, "authors": "Menghao Liu, Z. M. Wang, Feng Liu", "archs": ["Mamba/SSM"], "modals": ["Text", "Audio", "Video"], "stars": 4, "color": "#e74c3c", "doi": "10.1109/bibm62325.2024.10822358", "url": "https://doi.org/10.1109/bibm62325.2024.10822358", "doi_valid": true, "url_valid": true, "github": "", "gh_method": "", "compute": "24GB VRAM (RTX 4090)", "source": "openalex", "citationCount": 4, "ccf_tier": "B", "ccf_label": "CCF-B"}, {"id": 5, "title_full": "TF-Mamba: Text-enhanced Fusion Mamba with Missing Modalities for Robust Multimodal Sentiment Analysis", "title_short": "TF-Mamba: Text-enhanced Fusion Mamba with Mis…", "abs_full": "Multimodal Sentiment Analysis (MSA) with missing modalities has attracted increasing attention recently.While current Transformerbased methods leverage dense text information to maintain model robustness, their quadratic complexity hinders efficient long-range modeling and multimodal fusion.To this end, we propose a novel and efficient Text-enhanced Fusion Mamba (TF-Mamba) framework for robust MSA with missing modalities.Specifically, a Text-aware Modality Enhancement (TME) module aligns and enriches non-text modalities, while reconstructing the missing text semantics.Moreover, we develop Textbased Context Mamba (TC-Mamba) to capture intra-modal contextual dependencies under text collaboration.Finally, Text-guided Query Mamba (TQ-Mamba) queries text-guided multimodal information and learns joint representations for sentiment prediction.Extensive experiments on three MSA datasets demonstrate the effectiveness and efficiency of the proposed method under missing modality scenarios.Code is", "cn_abstract": "📌 论文标题: TF-Mamba: Text-enhanced Fusion Mamba with Missing Modalities for Robust Multimodal Sentiment Analysis\n✍️ 作者: Xiang Li、Xianfu Cheng、Dezhuang Miao 等\n📍 发表: EMNLP (2025)\n🧠 核心架构: Mamba/SSM、Transformer\n🎭 涉及模态: Text\n\n🇨🇳 中文摘要:\n本文提出了基于Mamba/SSM、Transformer的方法，融合Text模态信息。Multimodal Sentiment Analysis (MSA) with missing modalities has attracted increasing attention recently", "venue": "EMNLP", "year": 2025, "authors": "Xiang Li, Xianfu Cheng, Dezhuang Miao, Xiaoming Zhang, Zhoujun Li", "archs": ["Mamba/SSM", "Transformer"], "modals": ["Text"], "stars": 4, "color": "#e74c3c", "doi": "10.18653/v1/2025.findings-emnlp.602", "url": "https://aclanthology.org/2025.findings-emnlp.602.pdf", "doi_valid": true, "url_valid": true, "github": "", "gh_method": "", "compute": "24GB VRAM (RTX 4090)", "source": "openalex", "citationCount": 3, "ccf_tier": "B", "ccf_label": "CCF-B"}, {"id": 6, "title_full": "Structured State Space Duality (SSD) for RobustMechanical Fault Diagnosis: A Mamba-2 BasedApproach under Harsh Industrial Noise", "title_short": "Structured State Space Duality (SSD) for Robu…", "abs_full": "Accurate fault diagnosis of rolling element bearings is paramount for ensuring the operational reliability and safety of modern rotating machinery. While deep learning-based paradigms, such as Convolutional Neural Networks (CNNs) and Transformers, have demonstrated significant potential, they frequently encounter challenges in capturing long-range temporal dependencies within high-frequency vibration signals and suffer from severe performance degradation under harsh industrial noise. Furthermore, the quadratic computational complexity of Transformers poses a substantial bottleneck for real-time monitoring on edge devices. To address these issues, this paper proposes a novel robust diagnostic framework based on the state-of-the-art Mamba-2 (Structured State Space Duality) architecture. By leveraging the data-dependent selective scan mechanism, the proposed model adaptively isolates salient fault-induced impulsive signatures from stochastic background interference. To further bridge the gap between idealized laboratory data and real-world industrial scenarios, a noise-aware training strategy is integrated to enhance the manifold robustness of the state-space representation. Extensive experiments are conducted on the Case Western Reserve University (CWRU) bearing dataset and the Paderborn University (PU) bearing dataset, and benchmarked against 1D-CNN and state-of-the-art Transformers. Results demonstrate that the proposed Mamba-2 model achieves a perfect 100% accuracy under clean conditions and maintains a superior diagnostic accuracy of 78.90% at an extreme signal-to-noise ratio (SNR) of −6 dB, significantly outperforming 1D-CNN (60.34%) and Transformer-1D (22.78%). Hardware efficiency analysis on an NVIDIA RTX A5000 platform reveals that Mamba2 reduces peak memory consumption by 67.1% and accelerates inference by 1.74 times compared to Transformers, effectively eliminating the O(L 2 ) complexity bottleneck. Visualization via t-distributed Stochastic Neighbor Embedding (t-SNE) further confirms the model’s ability to learn highly discriminative and compact feature clusters. This research provides a high-efficiency and ultra-robust paradigm for intelligent fault diagnosis in complex industrial environments.", "cn_abstract": "📌 论文标题: Structured State Space Duality (SSD) for RobustMechanical Fault Diagnosis: A Mamba-2 BasedApproach under Harsh Industrial Noise\n✍️ 作者: Wang, Yi\n📍 发表: SSRN (2026)\n🧠 核心架构: Mamba/SSM、Transformer、CNN\n🎭 涉及模态: Video\n\n🇨🇳 中文摘要:\n本文提出了基于Mamba/SSM、Transformer、CNN的方法，融合Video模态信息。Accurate fault diagnosis of rolling element bearings is paramount for ensuring the operational reliability and safety of modern rotating machinery", "venue": "SSRN", "year": "2026", "authors": "Wang, Yi", "archs": ["Mamba/SSM", "Transformer", "CNN"], "modals": ["Video"], "stars": 2, "color": "#e74c3c", "doi": "10.2139/ssrn.6174525", "url": "https://doi.org/10.2139/ssrn.6174525", "doi_valid": true, "url_valid": true, "github": "", "gh_method": "", "compute": "24GB VRAM (RTX 4090)", "source": "crossref", "citationCount": 0, "ccf_tier": "", "ccf_label": ""}, {"id": 7, "title_full": "DynMultiDep: A Dynamic Multimodal Fusion and Multi-Scale Time Series Modeling Approach for Depression Detection", "title_short": "DynMultiDep: A Dynamic Multimodal Fusion and …", "abs_full": "Depression is a prevalent mental disorder that imposes a significant public health burden worldwide. Although multimodal detection methods have shown potential, existing techniques still face two critical bottlenecks: (i) insufficient integration of global patterns and local fluctuations in long-sequence modeling and (ii) static fusion strategies that fail to dynamically adapt to the complementarity and redundancy among modalities. To address these challenges, this paper proposes a dynamic multimodal depression detection framework, DynMultiDep, which combines multi-scale temporal modeling with an adaptive fusion mechanism. The core innovations of DynMultiDep lie in its Multi-scale Temporal Experts Module (MTEM) and Dynamic Multimodal Fusion module (DynMM). On one hand, MTEM employs Mamba experts to extract long-term trend features and utilizes local-window Transformers to capture short-term dynamic fluctuations, achieving adaptive fusion through a long-short routing mechanism. On the o", "cn_abstract": "📌 论文标题: DynMultiDep: A Dynamic Multimodal Fusion and Multi-Scale Time Series Modeling Approach for Depression Detection\n✍️ 作者: Jincheng Li、Menglin Zheng、Jiongyi Yang 等\n📍 发表: Journal of Imaging (2026)\n🧠 核心架构: Mamba/SSM、Transformer\n🎭 涉及模态: Video\n\n🇨🇳 中文摘要:\n本文提出了基于Mamba/SSM、Transformer的方法，融合Video模态信息。Depression is a prevalent mental disorder that imposes a significant public health burden worldwide", "venue": "Journal of Imaging", "year": 2026, "authors": "Jincheng Li, Menglin Zheng, Jiongyi Yang, Yihui Zhan, Xing Xie", "archs": ["Mamba/SSM", "Transformer"], "modals": ["Video"], "stars": 1, "color": "#e74c3c", "doi": "10.3390/jimaging12010029", "url": "https://www.mdpi.com/2313-433X/12/1/29/pdf?version=1767703138", "doi_valid": true, "url_valid": true, "github": "", "gh_method": "", "compute": "24GB VRAM (RTX 4090)", "source": "openalex", "citationCount": 0, "ccf_tier": "", "ccf_label": ""}, {"id": 8, "title_full": "Mamba YOLO: A Simple Baseline for Object Detection with State Space Model", "title_short": "Mamba YOLO: A Simple Baseline for Object Dete…", "abs_full": "Driven by the rapid development of deep learning technology, the YOLO series has set a new benchmark for real-time object detectors. Additionally, transformer-based structures have emerged as the most powerful solution in the field, greatly extending the model's receptive field and achieving significant performance improvements. However, this improvement comes at a cost, as the quadratic complexity of the self-attentive mechanism increases the computational burden of the model. To address this problem, we introduce a simple yet effective baseline approach called Mamba YOLO. Our contributions are as follows: 1) We propose that the ODMamba backbone introduce a State Space Model (SSM) with linear complexity to address the quadratic complexity of self-attention.  Unlike the other Transformer-base and SSM-base method, ODMamba is simple to train without pretraining. 2) For real-time requirement, we designed the macro structure of ODMamba, determined the optimal stage ratio and scaling size. 3) We design the RG Block that employs a multi-branch structure to model the channel dimensions, which addresses the possible limitations of SSM in sequence modeling, such as insufficient receptive fields and weak image localization. This design captures localized image dependencies more accurately and significantly. Extensive experiments on the publicly available COCO benchmark dataset show that Mamba YOLO achieves state-of-the-art performance compared to previous methods. Specifically, a tiny version of Mamba YOLO achieves a 7.5% improvement in mAP on a single 4090 GPU with an inference time of 1.5 ms.", "cn_abstract": "📌 论文标题: Mamba YOLO: A Simple Baseline for Object Detection with State Space Model\n✍️ 作者: Wang, Zeyu、Li, Chen、Xu, Huiying 等\n📍 发表: Proceedings of the AAAI Conference on Artificial Intelligence (2025)\n🧠 核心架构: Mamba/SSM、Transformer\n🎭 涉及模态: Video\n\n🇨🇳 中文摘要:\n本文提出了基于Mamba/SSM、Transformer的方法，融合Video模态信息。Driven by the rapid development of deep learning technology, the YOLO series has set a new benchmark for real-time object detectors", "venue": "Proceedings of the AAAI Conference on Artificial Intelligence", "year": "2025", "authors": "Wang, Zeyu, Li, Chen, Xu, Huiying, Zhu, Xinzhong, Li, Hongbo", "archs": ["Mamba/SSM", "Transformer"], "modals": ["Video"], "stars": 5, "color": "#e74c3c", "doi": "10.1609/aaai.v39i8.32885", "url": "https://doi.org/10.1609/aaai.v39i8.32885", "doi_valid": true, "url_valid": true, "github": "", "gh_method": "", "compute": "24GB VRAM (RTX 4090)", "source": "crossref", "citationCount": 95, "ccf_tier": "A", "ccf_label": "CCF-A"}, {"id": 9, "title_full": "Deep Learning and Large Language Models for Audio and Text Analysis in Predicting Suicidal Acts in Chinese Psychological Support Hotlines", "title_short": "Deep Learning and Large Language Models for A…", "abs_full": "Suicide is a pressing global issue, demanding urgent and effective preventive interventions. Among the various strategies in place, psychological support hotlines had proved as a potent intervention method. Approximately two million people in China attempt suicide annually, with many individuals making multiple attempts. Prompt identification and intervention for high-risk individuals are crucial to preventing tragedies. With the rapid advancement of artificial intelligence (AI), especially the development of large-scale language models (LLMs), new technological tools have been introduced to the field of mental health. This study included 1284 subjects, and was designed to validate whether deep learning models and LLMs, using audio and transcribed text from support hotlines, can effectively predict suicide risk. We proposed a simple LLM-based pipeline that first summarizes transcribed text from approximately one hour of speech to extract key features, and then predict suicidial bahavio", "cn_abstract": "📌 论文标题: Deep Learning and Large Language Models for Audio and Text Analysis in Predicting Suicidal Acts in Chinese Psychological Support Hotlines\n✍️ 作者: Yining Chen、Jianqiang Li、Changwei Song 等\n📍 发表: arXiv (Cornell University) (2024)\n🧠 核心架构: LLM\n🎭 涉及模态: Text+Audio\n\n🇨🇳 中文摘要:\n本文提出了基于LLM的方法，融合Text+Audio模态信息。Suicide is a pressing global issue, demanding urgent and effective preventive interventions", "venue": "arXiv (Cornell University)", "year": 2024, "authors": "Yining Chen, Jianqiang Li, Changwei Song, Qing Zhao, Yongsheng Tong", "archs": ["LLM"], "modals": ["Text", "Audio"], "stars": 2, "color": "#3498db", "doi": "10.48550/arxiv.2409.06164", "url": "https://arxiv.org/pdf/2409.06164", "doi_valid": true, "url_valid": true, "github": "", "gh_method": "", "compute": "24-80GB VRAM (A100 40G/80G, 多卡)", "source": "openalex", "citationCount": 3, "ccf_tier": "", "ccf_label": ""}, {"id": 10, "title_full": "An Efficient Fire Detection Algorithm Based on Mamba Space State Linear Attention", "title_short": "An Efficient Fire Detection Algorithm Based o…", "abs_full": "Abstract\n        The Mamba model, as a State Space Model (SSM), enhances the global receptive field and feature extraction capabilities of object detection models through an architecture inspired by Recurrent Neural Networks (RNNs). Compared to traditional Convolutional Neural Networks (CNNs) and Transformers, it excels in handling complex scale variations and multi-view interference, offering a novel approach for object detection tasks in dynamic environments such as fire detection. Therefore, this paper proposes an efficient attention mechanism, the Efficient-Mamba-Attention (EMA) module, which enhances input features through adaptive average pooling and SSM modules. By integrating the EMA module with the YOLOv9 architecture, a highly efficient fire detection algorithm is proposed, particularly suitable for complex scenarios. Additionally, the model introduces the ConvNeXtV2 block to strengthen the backbone network, compensating for the limitations of SSM models in local feature modeling. Finally, the introduction of dynamic non-monotonic focusing and distance penalty mechanisms optimizes the loss function, improving the accuracy of the detection bounding boxes and significantly enhancing the precision and robustness of the fire alarm tasks. Comparative experiments demonstrate that the proposed network excels in terms of AP50 and FPS, achieving an AP50 of 91.0% on the large-scale fire dataset (dataset1), and 87.2% on the small-scale fire dataset (dataset2), with FPS reaching 71 on dataset1 and 64 on dataset2. This demonstrates that the proposed method maintains high detection performance while achieving outstanding efficiency.", "cn_abstract": "📌 论文标题: An Efficient Fire Detection Algorithm Based on Mamba Space State Linear Attention\n✍️ 作者: Li, Yuming、Wang, Yongjie、Shao, Xiaorui 等\n📍 发表: Research Square (2025)\n🧠 核心架构: Mamba/SSM、Transformer、CNN、LSTM/RNN\n🎭 涉及模态: Unspecified\n\n🇨🇳 中文摘要:\n本文提出了基于Mamba/SSM、Transformer、CNN、LSTM/RNN的方法，融合Unspecified模态信息。Abstract\n        The Mamba model, as a State Space Model (SSM), enhances the global receptive field and feature extraction capabilities of object detection models through an architecture inspired by R", "venue": "Research Square", "year": "2025", "authors": "Li, Yuming, Wang, Yongjie, Shao, Xiaorui, Zheng, Anbo", "archs": ["Mamba/SSM", "Transformer", "CNN", "LSTM/RNN"], "modals": ["Unspecified"], "stars": 1, "color": "#e74c3c", "doi": "10.21203/rs.3.rs-5986604/v1", "url": "https://doi.org/10.21203/rs.3.rs-5986604/v1", "doi_valid": true, "url_valid": true, "github": "", "gh_method": "", "compute": "24GB VRAM (RTX 4090)", "source": "crossref", "citationCount": 0, "ccf_tier": "", "ccf_label": ""}, {"id": 11, "title_full": "xLSTM: Extended Long Short-Term Memory", "title_short": "xLSTM: Extended Long Short-Term Memory", "abs_full": "In the 1990s, the constant error carousel and gating were introduced as the central ideas of the Long Short-Term Memory (LSTM). Since then, LSTMs have stood the test of time and contributed to numerous deep learning success stories, in particular they constituted the first Large Language Models (LLMs). However, the advent of the Transformer technology with parallelizable self-attention at its core marked the dawn of a new era, outpacing LSTMs at scale. We now raise a simple question: How far do we get in language modeling when scaling LSTMs to billions of parameters, leveraging the latest techniques from modern LLMs, but mitigating known limitations of LSTMs? Firstly, we introduce exponential gating with appropriate normalization and stabilization techniques. Secondly, we modify the LSTM memory structure, obtaining: (i) sLSTM with a scalar memory, a scalar update, and new memory mixing, (ii) mLSTM that is fully parallelizable with a matrix memory and a covariance update rule. Integrati", "cn_abstract": "📌 论文标题: xLSTM: Extended Long Short-Term Memory\n✍️ 作者: Maximilian Beck、Korbinian Pöppel、Markus Spanring 等\n📍 发表: arXiv (Cornell University) (2024)\n🧠 核心架构: Transformer、LSTM/RNN、LLM\n🎭 涉及模态: Text\n\n🇨🇳 中文摘要:\n本文提出了基于Transformer、LSTM/RNN、LLM的方法，融合Text模态信息。In the 1990s, the constant error carousel and gating were introduced as the central ideas of the Long Short-Term Memory (LSTM)", "venue": "arXiv (Cornell University)", "year": 2024, "authors": "Maximilian Beck, Korbinian Pöppel, Markus Spanring, Andreas Auer, O. G. PRUDNIKOVA", "archs": ["Transformer", "LSTM/RNN", "LLM"], "modals": ["Text"], "stars": 2, "color": "#f39c12", "doi": "10.48550/arxiv.2405.04517", "url": "https://arxiv.org/pdf/2405.04517", "doi_valid": true, "url_valid": true, "github": "https://github.com/NX-AI/xlstm", "gh_method": "arxiv", "compute": "12-24GB VRAM (RTX 4080/4090)", "source": "openalex", "citationCount": 87, "ccf_tier": "", "ccf_label": ""}, {"id": 12, "title_full": "FDA-CAPMA: Federated domain adaptation with co-activation pattern and multimodal mamba for fMRI depression detection", "title_short": "FDA-CAPMA: Federated domain adaptation with c…", "abs_full": "No abstract.", "cn_abstract": "📌 论文标题: FDA-CAPMA: Federated domain adaptation with co-activation pattern and multimodal mamba for fMRI depression detection\n✍️ 作者: Lang He、Changwei Zhao、Yimeng Wang 等\n📍 发表: Information Fusion (2026)\n🧠 核心架构: Mamba/SSM\n🎭 涉及模态: Physiological\n\n📄 英文摘要: ...", "venue": "Information Fusion", "year": 2026, "authors": "Lang He, Changwei Zhao, Yimeng Wang, Zi Peng, Huaning Wang", "archs": ["Mamba/SSM"], "modals": ["Physiological"], "stars": 3, "color": "#e74c3c", "doi": "10.1016/j.inffus.2026.104213", "url": "https://doi.org/10.1016/j.inffus.2026.104213", "doi_valid": true, "url_valid": true, "github": "", "gh_method": "", "compute": "24GB VRAM (RTX 4090)", "source": "openalex", "citationCount": 4, "ccf_tier": "C", "ccf_label": "CCF-C"}, {"id": 13, "title_full": "Lingo-Aura: A Cognitive-Informed and Numerically Robust Multimodal Framework for Predictive Affective Computing in Clinical Diagnostics", "title_short": "Lingo-Aura: A Cognitive-Informed and Numerica…", "abs_full": "Accurate assessment of emotional states is critical in clinical diagnostics, yet traditional multimodal sentiment analysis often suffers from \"modality laziness,\" where models overlook subtle micro-expressions in favor of text priors. This study proposes Lingo-Aura, a cognitive-enhanced framework based on Mistral-7B designed to align visual micro-expressions and acoustic signals with large language model (LLM) embeddings. We introduce a robust Double-MLP Projector and global mean pooling to bridge the modality gap while suppressing temporal noise and ensuring numerical stability during mixed-precision training. Crucially, the framework leverages a teacher LLM to generate meta-cognitive label, such as reasoning mode and information stance, which are injected as explicit context to guide deep intent reasoning. Experimental results on the CMU-MOSEI dataset demonstrate that Lingo-Aura achieves a 135% improvement in emotion intensity correlation compared to text-only baselines. These findin", "cn_abstract": "📌 论文标题: Lingo-Aura: A Cognitive-Informed and Numerically Robust Multimodal Framework for Predictive Affective Computing in Clinical Diagnostics\n✍️ 作者: Lianghao Tan、Yongjia Song、Ziyan Wen\n📍 发表: Preprints.org (2026)\n🧠 核心架构: LLM\n🎭 涉及模态: Text+Audio+Video\n\n🇨🇳 中文摘要:\n本文提出了基于LLM的方法，融合Text+Audio+Video模态信息。Accurate assessment of emotional states is critical in clinical diagnostics, yet traditional multimodal sentiment analysis often suffers from \"modality laziness,\" where models overlook subtle micro-ex", "venue": "Preprints.org", "year": 2026, "authors": "Lianghao Tan, Yongjia Song, Ziyan Wen", "archs": ["LLM"], "modals": ["Text", "Audio", "Video"], "stars": 1, "color": "#3498db", "doi": "10.20944/preprints202601.0672.v1", "url": "https://www.preprints.org/frontend/manuscript/ee5174f6e348ece57e135edeb28aca38/download_pub", "doi_valid": true, "url_valid": true, "github": "", "gh_method": "", "compute": "24-80GB VRAM (A100 40G/80G, 多卡)", "source": "openalex", "citationCount": 4, "ccf_tier": "", "ccf_label": ""}, {"id": 14, "title_full": "SpeechT-RAG: Reliable Depression Detection in LLMs with Retrieval-Augmented Generation Using Speech Timing Information", "title_short": "SpeechT-RAG: Reliable Depression Detection in…", "abs_full": "Large Language Models (LLMs) have been increasingly adopted for health-related tasks, yet their performance in depression detection remains limited when relying solely on text input.While Retrieval-Augmented Generation (RAG) typically enhances LLM capabilities, our experiments indicate that traditional text-based RAG systems struggle to significantly improve depression detection accuracy.This challenge stems partly from the rich depression-relevant information encoded in acoustic speech patterns -information that current text-only approaches fail to capture effectively.To address this limitation, we conduct a systematic analysis of temporal speech patterns, comparing healthy individuals with those experiencing depression.Based on our findings, we introduce Speech Timing-based Retrieval-Augmented Generation, SpeechT-RAG, a novel system that leverages speech timing features for both accurate depression detection and reliable confidence estimation.This integrated approach not only outperf", "cn_abstract": "📌 论文标题: SpeechT-RAG: Reliable Depression Detection in LLMs with Retrieval-Augmented Generation Using Speech Timing Information\n✍️ 作者: Xiangyu Zhang、Hexin Liu、Qiquan Zhang 等\n📍 发表: ACL (2025)\n🧠 核心架构: LLM\n🎭 涉及模态: Text+Audio\n\n🇨🇳 中文摘要:\n本文提出了基于LLM的方法，融合Text+Audio模态信息。Large Language Models (LLMs) have been increasingly adopted for health-related tasks, yet their performance in depression detection remains limited when relying solely on text input", "venue": "ACL", "year": 2025, "authors": "Xiangyu Zhang, Hexin Liu, Qiquan Zhang, Beena Ahmed, Julien Epps", "archs": ["LLM"], "modals": ["Text", "Audio"], "stars": 5, "color": "#3498db", "doi": "10.18653/v1/2025.findings-acl.521", "url": "https://aclanthology.org/2025.findings-acl.521.pdf", "doi_valid": true, "url_valid": true, "github": "", "gh_method": "", "compute": "24-80GB VRAM (A100 40G/80G, 多卡)", "source": "openalex", "citationCount": 2, "ccf_tier": "A", "ccf_label": "CCF-A"}, {"id": 15, "title_full": "Multi-Modal masked autoencoder and parallel Mamba for 3D brain tumor segmentation", "title_short": "Multi-Modal masked autoencoder and parallel M…", "abs_full": "Accurate segmentation of brain tumors from multimodal MRI is essential for diagnosis and treatment planning. However, most existing approaches can only process single type of data modality, without exploiting the complementary information across different modalities. To overcome this limitation, a novel framework called MFMamba which integrates modality-aware masked autoencoder pretraining, a gated fusion strategy, and a Mamba-based backbone for efficient long-range modeling is proposed. In this design, one modality is fully masked while others are partially masked, forcing the network to reconstruct missing data through cross-modal learning. The gated fusion module then selectively incorporates generative priors into task-specific features, enhancing multimodal representations. Experimental results on the BraTS 2023 dataset show that MFMamba achieves Dice score of 93.77% for Whole Tumor and 92.69% for Tumor Core, corresponding to 1.6–2.1% improvements over state-of-the-art baselines.", "cn_abstract": "📌 论文标题: Multi-Modal masked autoencoder and parallel Mamba for 3D brain tumor segmentation\n✍️ 作者: Yaya Huang、Litong Liu、Tianzhen Zhang 等\n📍 发表: Pattern Recognition Letters (2025)\n🧠 核心架构: Mamba/SSM\n🎭 涉及模态: Unspecified\n\n🇨🇳 中文摘要:\n本文提出了基于Mamba/SSM的方法，融合Unspecified模态信息。Accurate segmentation of brain tumors from multimodal MRI is essential for diagnosis and treatment planning", "venue": "Pattern Recognition Letters", "year": 2025, "authors": "Yaya Huang, Litong Liu, Tianzhen Zhang, Sisi Wang, Chee‐Ming Ting", "archs": ["Mamba/SSM"], "modals": ["Unspecified"], "stars": 4, "color": "#e74c3c", "doi": "10.1016/j.patrec.2025.10.020", "url": "https://doi.org/10.1016/j.patrec.2025.10.020", "doi_valid": true, "url_valid": true, "github": "", "gh_method": "", "compute": "24GB VRAM (RTX 4090)", "source": "openalex", "citationCount": 1, "ccf_tier": "B", "ccf_label": "CCF-B"}];
const CENTER = {x:0,y:0};
let nodes=[], edges=[], ctx, canvas, W, H, hovered=null, selected=null;
let dragging=null, dragStart={x:0,y:0};
let paused=false, showFPS=false;

const REPULSION=25000, ATTRACTION=0.0015, CENTERING_FORCE=0.001, DAMPING=0.82, MAX_VEL=3;
const NODE_R=18, CENTER_R=28, FONT_SIZE=12;
const ARCH_COLORS={"Mamba/SSM": "#e74c3c", "Transformer": "#f39c12", "GCN": "#9b59b6", "CNN": "#2ecc71", "LSTM/RNN": "#1abc9c", "Diffusion": "#e67e22", "LLM": "#3498db", "Other": "#95a5a6"};

function hexToRGBA(h,a){let r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

function buildGraph() {
  nodes = [{id:0,x:0,y:0,vx:0,vy:0,radius:CENTER_R,color:'#f1c40f',label:'depression detection mamba sta',visible:true,stars:3,isCenter:true}];
  edges = [];
  let paperNodes = [];

  // Create paper nodes
  PAPERS.forEach((p,i)=>{
    let angle = (i/PAPERS.length)*Math.PI*2 + 0.5;
    let dist = 320 + i*15 + Math.random()*60;
    let node = {
      id:p.id, x:Math.cos(angle)*dist, y:Math.sin(angle)*dist, vx:0, vy:0,
      radius:NODE_R, color:p.color, label:p.title_short, visible:true,
      stars:p.stars, paper:p, _origIdx:i
    };
    nodes.push(node);
    paperNodes.push(node);
  });

  // Build semantic edges between papers
  for (let i=0;i<paperNodes.length;i++) {
    for (let j=i+1;j<paperNodes.length;j++) {
      let a=paperNodes[i].paper, b=paperNodes[j].paper;
      let score=0, sharedArch=null, sharedVenue=false, sharedYear=false;

      // Architecture match
      for (let arch of a.archs) {
        if (b.archs.includes(arch)) { score+=3; sharedArch=arch; break; }
      }
      // Modality match
      let modalMatch=0;
      for (let m of a.modals) { if (b.modals.includes(m)) modalMatch++; }
      score+=modalMatch;
      // Same venue
      if (a.venue&&b.venue&&a.venue===b.venue) { score+=2; sharedVenue=true; }
      // Same year
      if (a.year&&b.year&&a.year===b.year) { score+=1; sharedYear=true; }

      if (score>=2) {
        // Edge color: arch shared=architecture color, venue shared=gold, modal shared=green
        let eColor=sharedArch?ARCH_COLORS[sharedArch]||'#58a6ff':(sharedVenue?'#f1c40f':'#2ecc71');
        let eWidth=Math.min(score*0.6,4);
        edges.push({
          from:a.id, to:b.id, visible:true,
          color:eColor, width:eWidth, score:score,
          sharedArch:sharedArch, sharedVenue:sharedVenue
        });
      }
    }
  }

  // Limit edges per node: keep top 4 strongest
  let nodeEdges={};
  edges.forEach(e=>{
    if(!nodeEdges[e.from]) nodeEdges[e.from]=[];
    if(!nodeEdges[e.to]) nodeEdges[e.to]=[];
    nodeEdges[e.from].push(e);
    nodeEdges[e.to].push(e);
  });
  let filtered=[];
  edges.forEach(e=>{
    let fromCnt=nodeEdges[e.from]?nodeEdges[e.from].filter(function(x){return filtered.indexOf(x)>=0||x===e}).length:0;
    let toCnt=nodeEdges[e.to]?nodeEdges[e.to].filter(function(x){return filtered.indexOf(x)>=0||x===e}).length:0;
    if (fromCnt<4&&toCnt<4) filtered.push(e);
  });
  edges=filtered;
}

function initCanvas() {
  canvas = document.getElementById('gc');
  ctx = canvas.getContext('2d');
  onResize();
  buildGraph();
  CENTER.x=W/2; CENTER.y=H/2;
  // Place center node
  nodes[0].x=CENTER.x; nodes[0].y=CENTER.y;
  requestAnimationFrame(loop);
}

function onResize() {
  let panel = document.getElementById('graph-panel');
  let r = panel.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = W * (window.devicePixelRatio||1);
  canvas.height = H * (window.devicePixelRatio||1);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform((window.devicePixelRatio||1),0,0,(window.devicePixelRatio||1),0,0);
  if (nodes.length>0) { CENTER.x=W/2; CENTER.y=H/2; nodes[0].x=CENTER.x; nodes[0].y=CENTER.y; }
}

function starIcon(n) { return ['','📝','📄','⭐','🏆','👑'][n] || '📝'; }

// ═══ Physics ═══
let lastTime=0, frameCount=0, fpsTime=0;
function loop(ts) {
  if (!paused) simulate();
  draw();
  // FPS
  frameCount++;
  if (ts-fpsTime>1000) { document.getElementById('fps-label').textContent = frameCount+' fps'; frameCount=0; fpsTime=ts; }
  requestAnimationFrame(loop);
}

function simulate() {
  let visible = nodes.filter(n=>n.visible);
  let vEdges = edges.filter(e=>e.visible);
  // Repulsion
  for (let i=0;i<visible.length;i++) for (let j=i+1;j<visible.length;j++) {
    let a=visible[i],b=visible[j];
    let dx=a.x-b.x, dy=a.y-b.y;
    let d=Math.sqrt(dx*dx+dy*dy)+0.01;
    let force=REPULSION/(d*d);
    let fx=(dx/d)*force, fy=(dy/d)*force;
    a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
  }
  // Attraction along edges
  for (let e of vEdges) {
    let s=nodes.find(n=>n.id===e.from), t=nodes.find(n=>n.id===e.to);
    if (!s||!t||!s.visible||!t.visible) continue;
    let dx=t.x-s.x, dy=t.y-s.y, d=Math.sqrt(dx*dx+dy*dy)+0.01;
    let force=ATTRACTION*d;
    s.vx+=dx*force; s.vy+=dy*force;
    t.vx-=dx*force; t.vy-=dy*force;
  }
  // Center node gravity + paper node centering
  for (let n of visible) {
    if (n.id===0) {
      n.vx+=(CENTER.x-n.x)*CENTERING_FORCE*3;
      n.vy+=(CENTER.y-n.y)*CENTERING_FORCE*3;
    } else {
      n.vx+=(CENTER.x-n.x)*CENTERING_FORCE;
      n.vy+=(CENTER.y-n.y)*CENTERING_FORCE;
    }
    // Damping
    n.vx*=DAMPING; n.vy*=DAMPING;
    if (Math.abs(n.vx)<0.01) n.vx=0;
    if (Math.abs(n.vy)<0.01) n.vy=0;
    // Max velocity
    let spd=Math.sqrt(n.vx*n.vx+n.vy*n.vy);
    if (spd>MAX_VEL) { n.vx=(n.vx/spd)*MAX_VEL; n.vy=(n.vy/spd)*MAX_VEL; }
    // Apply
    n.x+=n.vx; n.y+=n.vy;
    // Bounds
    n.x=Math.max(NODE_R,Math.min(W-NODE_R,n.x));
    n.y=Math.max(NODE_R,Math.min(H-NODE_R,n.y));
  }
}

// ═══ Drawing ═══
function draw() {
  ctx.clearRect(0,0,W,H);

  // Edges (semantic connections between papers)
  edges.forEach(e=>{
    if (!e.visible) return;
    let s=nodes.find(n=>n.id===e.from), t=nodes.find(n=>n.id===e.to);
    if (!s||!t||!s.visible||!t.visible) return;
    let edgeColor = e.color||'#58a6ff';
    let edgeW = e.width||1.5;
    // Draw curved edge for same-architecture pairs, straight for others
    if (e.sharedArch) {
      let mx=(s.x+t.x)/2, my=(s.y+t.y)/2;
      let dx=t.x-s.x, dy=t.y-s.y, len=Math.sqrt(dx*dx+dy*dy);
      let perpX=-dy/len*20, perpY=dx/len*20;
      ctx.beginPath(); ctx.moveTo(s.x,s.y);
      ctx.quadraticCurveTo(mx+perpX, my+perpY, t.x, t.y);
      ctx.strokeStyle=hexToRGBA(edgeColor,0.5); ctx.lineWidth=edgeW; ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(t.x,t.y);
      ctx.strokeStyle=hexToRGBA(edgeColor,0.3); ctx.lineWidth=edgeW; ctx.stroke();
    }
    // Dash for modality-only connections
    if (!e.sharedArch&&!e.sharedVenue) {
      ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(t.x,t.y);
      ctx.strokeStyle=hexToRGBA(edgeColor,0.25); ctx.lineWidth=1; ctx.stroke();
      ctx.setLineDash([]);
    }
  });

  // Nodes (paper nodes first, center on top)
  let paperNodes = nodes.filter(n=>n.id!==0&&n.visible);
  paperNodes.forEach(n=>drawNode(n));
  // Center node
  let cn = nodes.find(n=>n.id===0);
  if (cn&&cn.visible) {
    ctx.beginPath(); ctx.arc(cn.x,cn.y,cn.radius,0,Math.PI*2);
    ctx.fillStyle=cn.color; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
    ctx.fillText(cn.label,cn.x,cn.y-32);
  }
}

function drawNode(n) {
  let isHover = (hovered===n), isSel = (selected===n);
  let r = n.radius + (isHover||isSel?4:0);

  // Glow for selected
  if (isSel) {
    ctx.beginPath(); ctx.arc(n.x,n.y,r+6,0,Math.PI*2);
    ctx.fillStyle=hexToRGBA(n.color,0.25); ctx.fill();
  }

  // Main circle
  ctx.beginPath(); ctx.arc(n.x,n.y,r,0,Math.PI*2);
  let grad = ctx.createRadialGradient(n.x-3,n.y-4,0,n.x,n.y,r);
  grad.addColorStop(0,'white'); grad.addColorStop(0.15,n.color); grad.addColorStop(1,hexToRGBA(n.color,0.6));
  ctx.fillStyle=grad; ctx.fill();

  // Border for stars
  if (n.stars>=5) { ctx.strokeStyle='#f1c40f'; ctx.lineWidth=4; ctx.stroke(); }
  else if (n.stars>=4) { ctx.strokeStyle='#f1c40f'; ctx.lineWidth=3; ctx.stroke(); }
  else if (n.stars>=3) { ctx.strokeStyle='#ccc'; ctx.lineWidth=2; ctx.stroke(); }

  // Icon inside
  ctx.fillStyle='#fff'; ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  let icons={5:'👑',4:'🏆',3:'⭐',2:'📄',1:'📝'};
  ctx.fillText(icons[n.stars]||'', n.x, n.y);

  // Label below
  ctx.fillStyle='var(--muted)' in document.documentElement.style?'#8b949e':'#aaa';
  ctx.font='10px sans-serif'; ctx.textAlign='center';
  let lbl = n.label;
  if (lbl.length>28) lbl = lbl.slice(0,26)+'…';
  ctx.fillText(lbl, n.x, n.y+n.radius+14);
}

// ═══ Mouse Interaction ═══
function getNodeAt(mx,my) {
  for (let n of nodes) {
    if (!n.visible) continue;
    let dx=mx-n.x, dy=my-n.y;
    if (dx*dx+dy*dy < (n.radius+8)*(n.radius+8)) return n;
  }
  return null;
}

function initEvents() {
  canvas = document.getElementById('gc');
  canvas.addEventListener('mousemove', function(e) {
  let r=canvas.getBoundingClientRect();
  let mx=e.clientX-r.left, my=e.clientY-r.top;
  let n = getNodeAt(mx,my);
  let tt = document.getElementById('tooltip');
  let pp = document.getElementById('graph-panel');

  if (dragging) {
    dragging.x=mx; dragging.y=my;
    canvas.style.cursor='grabbing'; tt.style.display='none';
    return;
  }

  if (n && n.id!==0) {
    canvas.style.cursor='pointer';
    if (hovered!==n) { hovered=n; }
    tt.style.display='block';
    tt.style.left=(e.clientX+16)+'px'; tt.style.top=(e.clientY-10)+'px';
    let ccfColorMap = {A:'#e74c3c',B:'#f39c12',C:'#3498db'};
    let ccfTag = n.paper.ccf_tier ? '<span style="background:'+ccfColorMap[n.paper.ccf_tier]+';color:#fff;font-size:10px;padding:1px 4px;border-radius:3px;margin-left:4px">CCF-'+n.paper.ccf_tier+'</span>' : '';
    let ghTag = n.paper.github ? '<br>🔗 GitHub: <a href="'+n.paper.github+'" target="_blank" style="color:#2ecc71">'+n.paper.github.replace('https://github.com/','.../').substring(0,25)+'</a>' : '<br>🔗 GitHub: 暂无';
    tt.innerHTML='<b>'+n.paper.title_full+'</b><div class="tt-meta">📍 '+n.paper.venue+' ('+(n.paper.year||'?')+') '+starIcon(n.stars)+ccfTag+'<br>🏗️ '+n.paper.archs.join(', ')+'<br>🎭 '+n.paper.modals.join(', ')+'<br>'+(n.paper.doi_valid?'📎 DOI ✅':'')+(n.paper.url_valid?' 🔗 URL ✅':'')+ghTag+'</div>';
  } else {
    canvas.style.cursor = n && n.id===0 ? 'pointer' : 'default';
    hovered=null;
    tt.style.display='none';
  }
});

canvas.addEventListener('mousedown', function(e) {
  let r=canvas.getBoundingClientRect();
  let mx=e.clientX-r.left, my=e.clientY-r.top;
  let n = getNodeAt(mx,my);
  if (n) {
    dragging=n;
    dragStart={x:n.x-mx, y:n.y-my};
    if (n.id!==0) showDetail(n.paper);
  }
});

window.addEventListener('mouseup', function() {
  if (dragging) { dragging.vx=0; dragging.vy=0; }
  dragging=null;
  canvas.style.cursor='default';
});

canvas.addEventListener('dblclick', function(e) {
  let r=canvas.getBoundingClientRect();
  let n=getNodeAt(e.clientX-r.left, e.clientY-r.top);
  if (n&&n.id!==0&&n.paper.url) window.open(n.paper.url,'_blank');
});

canvas.addEventListener('wheel', function(e) {
  e.preventDefault();
  // Simple scroll to nudge all nodes toward/away from center
  let factor = e.deltaY>0 ? 1.05 : 0.95;
  nodes.forEach(n=>{
    if (n.id===0||!n.visible) return;
    n.x=CENTER.x+(n.x-CENTER.x)*factor;
    n.y=CENTER.y+(n.y-CENTER.y)*factor;
  });
}, {passive:false});
}

// ═══ Detail Panel ═══
function showDetail(paper) {
  let panel=document.getElementById('side-panel');
  let content=document.getElementById('side-content');
  selected=nodes.find(n=>n.paper===paper)||null;
  _currentPaperId = paper.id;
  panel.classList.add('open');
  content.innerHTML=`
    <h3>${paper.title_full}</h3>
    <div class="meta">
      <span class="tag venue">📍 ${paper.venue}${paper.year?' ('+paper.year+')':''} ${starIcon(paper.stars)}</span>
      ${paper.archs.map(a=>'<span class="tag arch">🏗️ '+a+'</span>').join('')}
      ${paper.modals.map(m=>'<span class="tag modal">🎭 '+m+'</span>').join('')}
    </div>
    <p><b>✍️ 作者:</b> ${paper.authors}</p>
    <p><b>💻 算力需求:</b> ${paper.compute}</p>
    ${paper.ccf_tier?'<p><b>🏅 CCF分区:</b> <span style="background:'+['','#e74c3c','#f39c12','#3498db'][{'A':1,'B':2,'C':3}.get(paper.ccf_tier,0)]+';color:#fff;padding:2px 8px;border-radius:4px;font-weight:bold">CCF-'+paper.ccf_tier+'</span></p>':''}
    <p><b>🔗 GitHub:</b> ${paper.github?'<a href="'+paper.github+'" target="_blank" style="color:#58a6ff">'+(paper.gh_method?'['+paper.gh_method+'] ':'')+paper.github.replace('https://github.com/','')+'</a>':'暂无'}</p>
    <div class="abstract-box"><b>🇨🇳 中文简介</b><br><br>${paper.cn_abstract.split('\n').map(function(l){return '<p style="margin:4px 0;font-size:13px">'+l+'</p>'}).join('')}</div>
    <div class="abstract-box" style="border-left-color:#f39c12"><b>📄 英文摘要</b><br><br>${paper.abs_full}</div>
    <div class="links">
      ${paper.url_valid?'<a href="'+paper.url+'" target="_blank">🔗 原文链接 ✅</a>':(paper.url?'<a href="'+paper.url+'" target="_blank" class="secondary">🔗 原文链接 ⚠️</a>':'')}
      ${paper.doi_valid?'<a href="https://doi.org/'+paper.doi+'" target="_blank" class="secondary">📎 DOI ✅</a>':(paper.doi?'<span class="tag" style="background:rgba(231,76,60,0.15);color:#e74c3c;font-size:12px">📎 DOI未验证</span>':'')}
      <button onclick="document.getElementById('side-panel').classList.remove('open');selected=null">✕ 关闭</button>
      <button onclick="deleteCurrentPaper()" style="background:#e74c3c">🗑️ 删除此论文</button>
    </div>
  `;
}

// ═══ Filtering ═══
function applyFilter() {
  let q = (document.getElementById('search-input').value||'').toLowerCase();
  let arch = document.getElementById('arch-filter').value;
  let modal = document.getElementById('modal-filter').value;
  let star = parseInt(document.getElementById('star-filter').value)||0;

  nodes.forEach(n=>{
    if (n.id===0) { n.visible=true; return; }
    let p=n.paper;
    let ok=true;
    if (q && !p.title_full.toLowerCase().includes(q) && !p.authors.toLowerCase().includes(q) && !p.venue.toLowerCase().includes(q) && !p.abs_full.toLowerCase().includes(q)) ok=false;
    if (arch && !p.archs.includes(arch)) ok=false;
    if (modal && !p.modals.includes(modal)) ok=false;
    if (star && p.stars!==star) ok=false;
    n.visible=ok;
  });
  edges.forEach(e=>{
    let t=nodes.find(n=>n.id===e.to);
    e.visible = t ? t.visible : true;
  });
}

// ═══ Table View ═══
function populateTable() {
  let q = (document.getElementById('search-input').value||'').toLowerCase();
  let arch = document.getElementById('arch-filter').value;
  let modal = document.getElementById('modal-filter').value;
  let star = parseInt(document.getElementById('star-filter').value)||0;
  let filtered=PAPERS.filter(p=>{
    if (q && !p.title_full.toLowerCase().includes(q) && !p.authors.toLowerCase().includes(q) && !p.venue.toLowerCase().includes(q) && !p.abs_full.toLowerCase().includes(q)) return false;
    if (arch && !p.archs.includes(arch)) return false;
    if (modal && !p.modals.includes(modal)) return false;
    if (star && p.stars!==star) return false;
    return true;
  });
  let tbody=document.getElementById('table-body');
  tbody.innerHTML=filtered.map((p,i)=>`
    <tr onclick="showDetail(PAPERS.find(function(x){return x.id===${p.id}}))" style="${i%2?'background:rgba(255,255,255,0.02)':''}">
      <td>${i+1}</td>
      <td><div class="t-title">${p.title_full}</div><div class="t-venue">${p.authors}</div></td>
      <td><div class="t-venue">${p.venue}${p.year?' ('+p.year+')':''}</div></td>
      <td>${p.ccf_tier?'<span style="background:'+(p.ccf_tier==='A'?'#e74c3c':p.ccf_tier==='B'?'#f39c12':'#3498db')+';color:#fff;padding:1px 5px;border-radius:3px;font-size:11px;font-weight:bold">CCF-'+p.ccf_tier+'</span>':'<span style="color:#888;font-size:11px">—</span>'}</td>
      <td>${p.archs.map(a=>'<span style="color:'+(ARCH_COLORS[a]||'#888')+'">●</span> '+a).join('<br>')}</td>
      <td>${p.modals.join(', ')}</td>
      <td style="font-size:11px;color:var(--muted)">${p.compute}</td>
      <td>${p.github?'<a href="'+p.github+'" target="_blank" style="color:#2ecc71" title="'+p.gh_method+'检出">✅</a>':'<span style="color:#888">—</span>'}</td>
      <td class="star-cell">${starIcon(p.stars)}</td>
      <td>${p.year||'?'}</td>
      <td><button onclick="event.stopPropagation();deletePaperById(${p.id})" style="background:none;border:none;cursor:pointer;font-size:16px" title="删除">🗑️</button></td>
    </tr>
  `).join('');
}

// ═══ View Switch ═══
function switchView(view) {
  let gp=document.getElementById('graph-panel'), tp=document.getElementById('table-panel');
  if (view==='graph') {
    gp.style.display=''; tp.classList.remove('show');
    document.getElementById('btn-graph').classList.add('active');
    document.getElementById('btn-table').classList.remove('active');
    onResize();
  } else {
    gp.style.display='none'; tp.classList.add('show');
    document.getElementById('btn-table').classList.add('active');
    document.getElementById('btn-graph').classList.remove('active');
    populateTable();
  }
}

// ═══ Delete & Save ═══
let deletedIds = [];
let _currentPaperId = null;

function deleteCurrentPaper() {
  if (!_currentPaperId) return;
  deletePaperById(_currentPaperId);
  document.getElementById('side-panel').classList.remove('open');
  _currentPaperId = null;
}

function deletePaperById(pid) {
  if (deletedIds.includes(pid)) return;
  deletedIds.push(pid);
  nodes.forEach(n => { if (n.id === pid) { n.visible = false; } });
  edges.forEach(e => { if (e.from === pid || e.to === pid) { e.visible = false; } });
  updateDelCount();
}

function updateDelCount() {
  let el = document.getElementById('del-count');
  if (deletedIds.length > 0) {
    el.style.display = 'inline';
    el.textContent = '已删除: ' + deletedIds.length + ' 篇';
  } else {
    el.style.display = 'none';
  }
}

function saveChanges() {
  let remaining = PAPERS.filter(p => !deletedIds.includes(p.id));
  if (remaining.length === PAPERS.length) {
    alert('没有删除任何论文。');
    return;
  }
  // Save both the updated cache and deleted IDs for reload
  let output = { papers: remaining, deleted_ids: deletedIds };
  let json = JSON.stringify(output, null, 2);
  let blob = new Blob([json], {type:'application/json'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'literature_papers.json';
  a.click();
  URL.revokeObjectURL(a.href);
  let delList = PAPERS.filter(p=>deletedIds.includes(p.id)).map(p=>p.id+': '+p.title_short).join('\n');
  alert('已下载 JSON 文件。请告诉我:\n"刷新图谱并删除这些论文：[\n'+delList+'\n]"');
}

// ═══ Init ═══
window.addEventListener('DOMContentLoaded', ()=>{
  initCanvas();
  initEvents();
  window.addEventListener('resize', onResize);
});
</script>
